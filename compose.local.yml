name: techbridge-local

services:
  mongo:
    image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    command: ["mongod", "--replSet", "techbridge-local", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            if (error.code === 94) {
              rs.initiate({_id: 'techbridge-local', members: [{_id: 0, host: 'mongo:27017'}]});
            } else { throw error; }
          }
          const status = db.hello();
          if (status.setName !== 'techbridge-local' || !status.isWritablePrimary) quit(1);
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 30
    restart: unless-stopped

volumes:
  mongo-data:
